[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "miwae-corpus-api"
version = "0.1.0"
description = "Transparent corpus-analysis API for MIWAE function, form, and distribution profiling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehmet Altay" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
spacy = ["spacy>=3.8,<4"]

[project.scripts]
miwae = "miwae_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miwae_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

